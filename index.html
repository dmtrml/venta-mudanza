<style>
:root{
  --bg:#f6f1ea; --surface:#fffdf9; --ink:#22201c; --muted:#6f685e; --line:#e6ddd0;
  --accent:#c4562b; --accent-ink:#fff; --chip:#efe6d9; --chip-on:#22201c; --chip-on-ink:#fff;
  --wa:#1f9d55; --wa-ink:#fff; --tg:#2481cc; --photo:#ece5da; --sold:#5d5a55; --res:#d99a1e;
  --shadow:0 1px 2px rgba(40,30,20,.06),0 6px 20px rgba(40,30,20,.07);
  --r:18px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#171614; --surface:#211f1c; --ink:#f1ece4; --muted:#a69e92; --line:#35312c;
    --accent:#e67a4c; --chip:#2c2925; --chip-on:#f1ece4; --chip-on-ink:#171614;
    --photo:#2a2724; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* header */
header{padding:22px 0 6px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
h1{font-size:clamp(26px,6.4vw,40px);line-height:1.08;margin:0;letter-spacing:-.02em;font-weight:800}
h1 span{color:var(--accent)}
.lead{margin:8px 0 12px;color:var(--muted);max-width:56ch;font-size:15px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none;background:var(--surface)}
.lang button{border:0;background:none;padding:7px 12px;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed=true]{background:var(--chip-on);color:var(--chip-on-ink)}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 4px;padding:0;list-style:none}
.facts li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:13.5px}

/* filter */
.filters{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;margin-bottom:6px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--chip);border-radius:999px;padding:8px 14px;font-size:14.5px;cursor:pointer;white-space:nowrap}
.chip small{opacity:.6;margin-left:4px}
.chip[aria-pressed=true]{background:var(--chip-on);color:var(--chip-on-ink)}

/* grid */
.grid{display:grid;grid-template-columns:1fr;gap:18px;padding-bottom:40px}
@media (min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;cursor:pointer}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card.vendido{opacity:.62}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.meta{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13.5px}
.num{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink);background:var(--chip);border-radius:6px;padding:1px 7px}
.card h2{font-size:18px;line-height:1.25;margin:0;font-weight:650}
.price{font-size:24px;font-weight:800;letter-spacing:-.01em}
.note{font-size:13.5px;color:var(--muted);font-weight:500;margin-left:6px}
.vendido .amt{text-decoration:line-through}
.off{display:inline-block;vertical-align:middle;margin-left:8px;font-size:13px;font-weight:700;letter-spacing:0;color:var(--accent);border:1px solid currentColor;border-radius:999px;padding:1px 8px}
.when{font-size:13.5px;font-weight:600;color:var(--ink);background:var(--chip);border-radius:8px;padding:4px 9px;align-self:flex-start}
.kv .src{color:var(--muted);font-size:13.5px}
.more{min-height:48px}
.actions{margin-top:auto;padding-top:8px;display:flex;gap:8px}
.wa,.tg{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--wa);color:var(--wa-ink);text-decoration:none;font-weight:700;border-radius:12px;padding:12px 16px;flex:1;min-height:48px}
.wa svg,.tg svg{width:20px;height:20px;flex:none}
.tg{background:var(--tg)}
.btns{display:flex;flex-direction:column;gap:8px;max-width:420px}
.more{border:1px solid var(--line);background:none;border-radius:12px;padding:0 14px;cursor:pointer;font-weight:600;color:var(--muted)}

/* carousel */
.car{position:relative;background:var(--photo)}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;aspect-ratio:4/5;overscroll-behavior-x:contain}
@media (min-width:640px){.card .track{aspect-ratio:1/1}}
.track::-webkit-scrollbar{display:none}
.track video{flex:0 0 100%;width:100%;height:100%;object-fit:contain;scroll-snap-align:center;scroll-snap-stop:always;display:block;background:#000}
.track img{flex:0 0 100%;width:100%;height:100%;object-fit:contain;scroll-snap-align:center;scroll-snap-stop:always;display:block;user-select:none;-webkit-user-drag:none}
.ph{flex:0 0 100%;display:grid;place-items:center;font-size:72px;color:var(--muted)}
.ph span{display:block;font-size:14px;text-align:center}
.dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:6px;pointer-events:none}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(0,0,0,.18);transition:transform .2s,background .2s}
.dots i.on{background:#fff;transform:scale(1.3)}
.count{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12.5px;border-radius:999px;padding:3px 9px;font-variant-numeric:tabular-nums}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#222;box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer;display:none;place-items:center;font-size:22px;line-height:1;opacity:0;transition:opacity .15s}
.arrow.prev{left:10px}.arrow.next{right:10px}
.arrow[disabled]{visibility:hidden}
@media (hover:hover) and (pointer:fine){
  .arrow{display:grid}
  .car:hover .arrow,.arrow:focus-visible{opacity:1}
  .modal .arrow{opacity:1}
}
.badge{position:absolute;top:12px;left:12px;z-index:2;font-weight:800;font-size:13px;letter-spacing:.06em;color:#fff;border-radius:8px;padding:5px 10px}
.badge.vendido{background:var(--sold)}
.badge.reservado{background:var(--res);color:#2a1d00}

/* modal */
.modal{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;display:none;overscroll-behavior:contain}
.modal.open{display:block}
body.locked{overflow:hidden}
.mbar{position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--bg)}
.ibtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:40px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:600;font-size:14.5px}
.mbody{max-width:1100px;margin:0 auto;padding:0 0 40px}
.mbody .track{aspect-ratio:auto;height:min(60vh,760px)}
.mtext{padding:16px}
.mtext h2{font-size:22px;line-height:1.25;margin:6px 0 4px}
.mtext .price{font-size:28px}
.mtext p{margin:12px 0;max-width:62ch}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:12px 0;font-size:15px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.mtext .wa,.mtext .tg{flex:none;width:100%}
@media (min-width:900px){
  .modal{background:rgba(20,16,12,.6)}
  .mbar{background:transparent;max-width:1100px;margin:16px auto 0;padding:0 0 10px}
  .mbody{display:grid;grid-template-columns:1.35fr 1fr;background:var(--surface);border-radius:var(--r);overflow:hidden;margin-bottom:40px}
  .mbody .track{height:min(80vh,760px)}
  .mtext{padding:28px}
}
footer{color:var(--muted);font-size:13.5px;padding:10px 0 40px;border-top:1px solid var(--line)}
.empty{color:var(--muted);padding:30px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--chip-on);color:var(--chip-on-ink);padding:10px 16px;border-radius:12px;font-size:14.5px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<header class="wrap">
  <div class="top">
    <h1 id="h1"></h1>
    <div class="lang" role="group" aria-label="Idioma / Язык">
      <button type="button" data-lang="es" aria-pressed="true">ES</button>
      <button type="button" data-lang="ru" aria-pressed="false">RU</button>
    </div>
  </div>
  <p class="lead" id="lead"></p>
  <ul class="facts" id="facts"></ul>
</header>
<nav class="filters"><div class="wrap"><div class="chips" id="chips"></div></div></nav>
<main class="wrap"><div class="grid" id="grid"></div></main>
<footer class="wrap" id="foot"></footer>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle">
  <div class="mbar">
    <button type="button" class="ibtn" id="mclose"></button>
    <button type="button" class="ibtn" id="mshare"></button>
  </div>
  <div class="mbody" id="mbody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
var T = {
  es:{
    h1:'Vendo todo <span>por mudanza</span>',
    lead:'Me mudo y vendo lo que no me llevo: cosas de bebé, electrodomésticos, herramientas y más. Todo usado y en buen estado.',
    facts:['📍 Retiro en Barrio Pueyrredón, Córdoba Capital','💵 Efectivo o transferencia','🛵 Sin envío, coordino con tu cadete','🏷️ Llevando 3 o más cosas: 10% de descuento en el total'],
    all:'Todo', wa:'Escribir por WhatsApp', tg:'Escribir por Telegram', more:'Ver', back:'← Volver', share:'Compartir', copied:'Link copiado',
    msg:'Hola, me interesa: ', estado:'Estado', num:'Artículo',
    vendido:'VENDIDO', reservado:'RESERVADO', sold:'Ya se vendió', resNote:'Reservado: podés escribir por si se libera',
    nophoto:'Fotos por WhatsApp', empty:'No hay artículos en esta categoría.',
    whenK:'Entrega', when:function(m){return '📅 Se entrega en '+m+' · reservá con seña'},
    video:'video', nuevo:'Nuevo hoy', off:'vs. nuevo', similar:'modelo similar', anio:'Comprado en', medidas:'Medidas', aprox:'aprox.', cm:'cm', kg:'kg',
    cadete:'Para el cadete', moto:'🛵 Entra en una moto', auto:'🚗 Necesita auto', prueba:'Prueba', probar:'✅ Se puede probar al retirar',
    meses:['ene.','feb.','mar.','abr.','may.','jun.','jul.','ago.','sep.','oct.','nov.','dic.'],
    foot:function(d){return 'Precios en pesos argentinos. Actualizado: '+d+'. Lo vendido queda marcado como VENDIDO.'},
    fmt:function(n){return '$'+n.toLocaleString('es-AR')}
  },
  ru:{
    h1:'Распродажа <span>перед переездом</span>',
    lead:'Переезжаю и продаю то, что не забираю: детские вещи, технику, инструменты и другое. Всё б/у в хорошем состоянии.',
    facts:['📍 Самовывоз: Barrio Pueyrredón, Córdoba Capital','💵 Наличные или перевод','🛵 Не доставляю, передам вашему курьеру','🏷️ От 3 вещей — скидка 10% на всё'],
    all:'Все', wa:'Написать в WhatsApp', tg:'Написать в Telegram', more:'Подробнее', back:'← Назад', share:'Поделиться', copied:'Ссылка скопирована',
    msg:'Здравствуйте, интересует: ', estado:'Состояние', num:'Номер',
    vendido:'ПРОДАНО', reservado:'БРОНЬ', sold:'Уже продано', resNote:'Забронировано: можно написать на случай, если освободится',
    nophoto:'Фото пришлю в WhatsApp', empty:'В этой категории ничего нет.',
    whenK:'Когда забрать', when:function(m){return '📅 Отдам в '+m+' · бронь с задатком'},
    video:'видео', nuevo:'Новый сейчас', off:'от нового', similar:'похожая модель', anio:'Куплено в', medidas:'Размеры', aprox:'примерно', cm:'см', kg:'кг',
    cadete:'Курьеру', moto:'🛵 Влезет в мото', auto:'🚗 Нужна машина', prueba:'Проверка', probar:'✅ Можно проверить при встрече',
    meses:['янв.','фев.','мар.','апр.','мая','июн.','июл.','авг.','сен.','окт.','ноя.','дек.'],
    foot:function(d){return 'Цены в аргентинских песо. Обновлено: '+d+'. Проданное помечено ПРОДАНО.'},
    fmt:function(n){return n.toLocaleString('ru-RU').replace(/ /g,' ')+' ARS'}
  }
};
var TG_SVG='<svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M21.9 4.3 18.7 19.5c-.2 1-.9 1.3-1.7.8l-4.8-3.5-2.3 2.2c-.3.3-.5.5-1 .5l.3-4.9 8.9-8c.4-.3-.1-.5-.6-.2L6.5 13.3 1.8 11.8c-1-.3-1-1 .2-1.5L20.6 3.2c.9-.3 1.6.2 1.3 1.1Z"/></svg>';
var WA_SVG='<svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.3c0-.1-.2-.2-.4-.3Z"/></svg>';

var data=null, lang='es', cat='all', openedHere=false;
try{ var s=localStorage.getItem('lang'); if(s==='ru'||s==='es') lang=s; }catch(e){}
var q=new URLSearchParams(location.search).get('lang'); if(q==='ru'||q==='es') lang=q;

function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function t(){return T[lang]}
function L(o){return o?(o[lang]||o.es||''):''}
function items(){return data.items.filter(function(i){return i.visible!==false})}
function sorted(list){var r={disponible:0,reservado:1,vendido:2};return list.slice().sort(function(a,b){return (r[a.status]||0)-(r[b.status]||0)})}
function pageUrl(id){return location.origin+location.pathname+(id?'#'+id:'')}
function msgText(it){return t().msg+(it.id.match(/^\d/)?it.id+' ':'')+L(it.titulo)+'\n'+pageUrl(it.id)}
function waLink(it){
  return 'https://wa.me/'+data.config.whatsapp+'?text='+encodeURIComponent(msgText(it));
}
function fmtDate(d){var p=d.split('-');return p[2]+'.'+p[1]+'.'+p[0]}

function carousel(it,big){
  var nf=it.fotos||0, n=nf+(it.video?1:0), h='<div class="car">';
  if(it.status!=='disponible') h+='<span class="badge '+it.status+'">'+t()[it.status]+'</span>';
  h+='<div class="track" tabindex="-1">';
  if(!n){ h+='<div class="ph">📷<span>'+t().nophoto+'</span></div>'; }
  for(var k=1;k<=nf;k++){
    h+='<img src="img/'+it.id+'/'+k+'.webp" alt="'+esc(L(it.titulo))+' — '+k+'/'+n+'" '+(k>1?'loading="lazy" ':'')+'decoding="async" draggable="false">';
  }
  // видео — последним слайдом, грузится только по нажатию
  if(it.video) h+='<video src="img/'+it.id+'/video.mp4" poster="img/'+it.id+'/video.webp" controls playsinline preload="none"></video>';
  h+='</div>';
  if(n>1){
    var sfx=it.video?' · ▶ '+t().video:'';
    h+='<span class="count" data-sfx="'+sfx+'">1/'+n+sfx+'</span><div class="dots">';
    for(k=0;k<n;k++) h+='<i'+(k?'':' class="on"')+'></i>';
    h+='</div><button type="button" class="arrow prev" aria-label="‹" disabled>‹</button><button type="button" class="arrow next" aria-label="›">›</button>';
  }
  return h+'</div>';
}
function wire(root){
  root.querySelectorAll('.car').forEach(function(c){
    var tr=c.querySelector('.track'), dots=c.querySelectorAll('.dots i'), cnt=c.querySelector('.count'),
        pv=c.querySelector('.prev'), nx=c.querySelector('.next'), n=dots.length;
    if(!n) return;
    var cur=0, raf=0;
    function upd(){
      raf=0; var i=Math.round(tr.scrollLeft/tr.clientWidth); if(i===cur) return; cur=i;
      dots.forEach(function(d,j){d.classList.toggle('on',j===i)});
      cnt.textContent=(i+1)+'/'+n+(cnt.dataset.sfx||''); pv.disabled=i<=0; nx.disabled=i>=n-1;
      tr.querySelectorAll('video').forEach(function(v){v.pause()});
    }
    tr.addEventListener('scroll',function(){if(!raf) raf=requestAnimationFrame(upd)},{passive:true});
    function go(d,e){e.stopPropagation();tr.scrollBy({left:d*tr.clientWidth,behavior:'smooth'})}
    pv.addEventListener('click',function(e){go(-1,e)}); nx.addEventListener('click',function(e){go(1,e)});
    c._go=function(d){tr.scrollBy({left:d*tr.clientWidth,behavior:'smooth'})};
  });
}
function tgLink(it){
  return 'https://t.me/'+data.config.telegram+'?text='+encodeURIComponent(msgText(it));
}
// short=true: компактные кнопки в ленте; в RU первым идёт Telegram
function waBtn(it,short){
  if(it.status==='vendido') return '';
  var wa='<a class="wa" href="'+waLink(it)+'" target="_blank" rel="noopener">'+WA_SVG+(short?'WhatsApp':t().wa)+'</a>';
  var tg=data.config.telegram?'<a class="tg" href="'+tgLink(it)+'" target="_blank" rel="noopener">'+TG_SVG+(short?'Telegram':t().tg)+'</a>':'';
  return lang==='ru'?tg+wa:wa+tg;
}
function offPct(it){return (it.nuevo&&it.precio&&it.nuevo>it.precio&&it.status!=='vendido')?Math.round((1-it.precio/it.nuevo)*100):0}
function priceHtml(it){
  var p=offPct(it);
  return '<div class="price '+it.status+'"><span class="amt">'+(it.precio?t().fmt(it.precio):'')+'</span>'+(it.nota?'<span class="note">'+esc(L(it.nota))+'</span>':'')+
    (p>=10?'<span class="off">−'+p+'% '+t().off+'</span>':'')+'</div>';
}
function ym(s){var d=(s||'').split('-');return d.length===2?t().meses[+d[1]-1]+' '+d[0]:''}
function nuevoFecha(){return ym(data.config.nuevo_fecha)}
// Вещь в пользовании до отъезда: «entrega": "2027-01" — продаём сейчас под бронь
function whenHtml(it){return it.entrega&&it.status!=='vendido'?'<div class="when">'+esc(t().when(ym(it.entrega)))+'</div>':''}
// Доп. строки карточки: цена нового, год покупки, габариты, курьер, проверка
function extraKv(it){
  var h='';
  if(it.nuevo&&it.status!=='vendido') h+='<dt>'+t().nuevo+'</dt><dd>'+t().fmt(it.nuevo)+' <span class="src">('+(it.nuevo_similar?t().similar+', ':'')+esc(it.nuevo_fuente||'Mercado Libre')+', '+esc(nuevoFecha())+')</span></dd>';
  if(it.anio) h+='<dt>'+t().anio+'</dt><dd>'+it.anio+'</dd>';
  if(it.medidas) h+='<dt>'+t().medidas+'</dt><dd>'+esc(it.medidas)+' '+t().cm+(it.peso?', '+String(it.peso).replace('.',',')+' '+t().kg:'')+' <span class="src">('+t().aprox+')</span></dd>';
  if(it.transporte) h+='<dt>'+t().cadete+'</dt><dd>'+t()[it.transporte]+'</dd>';
  if(it.probar) h+='<dt>'+t().prueba+'</dt><dd>'+t().probar+'</dd>';
  return h;
}

function renderHead(){
  document.documentElement.lang=lang;
  $('h1').innerHTML=t().h1; $('lead').textContent=t().lead;
  $('facts').innerHTML=t().facts.map(function(f){return '<li>'+esc(f)+'</li>'}).join('');
  document.querySelectorAll('.lang button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.lang===lang)});
  $('foot').textContent=t().foot(fmtDate(data.config.actualizado));
  $('mclose').textContent=t().back; $('mshare').textContent=t().share;
}
function renderChips(){
  var all=items(), h='<button type="button" class="chip" data-cat="all" aria-pressed="'+(cat==='all')+'">'+t().all+'<small>'+all.length+'</small></button>';
  data.categorias.forEach(function(c){
    var n=all.filter(function(i){return i.cat===c.id}).length; if(!n) return;
    h+='<button type="button" class="chip" data-cat="'+c.id+'" aria-pressed="'+(cat===c.id)+'">'+esc(L(c))+'<small>'+n+'</small></button>';
  });
  $('chips').innerHTML=h;
}
function renderGrid(){
  var list=sorted(items().filter(function(i){return cat==='all'||i.cat===cat}));
  if(!list.length){$('grid').innerHTML='<p class="empty">'+t().empty+'</p>';return}
  $('grid').innerHTML=list.map(function(it){
    return '<article class="card '+it.status+'" data-id="'+it.id+'" tabindex="0" aria-label="'+esc(L(it.titulo))+'">'+carousel(it,false)+
      '<div class="body"><div class="meta">'+(it.id.match(/^\d/)?'<span class="num">'+it.id+'</span>':'')+'<span>'+esc(L(it.estado))+'</span></div>'+
      '<h2>'+esc(L(it.titulo))+'</h2>'+priceHtml(it)+whenHtml(it)+
      '<div class="actions">'+(it.status==='vendido'?'<button type="button" class="more">'+t().more+'</button>':waBtn(it,true))+'</div></div></article>';
  }).join('');
  wire($('grid'));
}
function render(){renderHead();renderChips();renderGrid();var id=curHash();if(id)openItem(id,false)}

function curHash(){return decodeURIComponent(location.hash.slice(1))}
function find(id){return items().filter(function(i){return i.id===id})[0]}
function openItem(id){
  var it=find(id); if(!it){closeModal(true);return}
  var cname=(data.categorias.filter(function(c){return c.id===it.cat})[0]);
  $('mbody').innerHTML=carousel(it,true)+'<div class="mtext"><div class="meta">'+(it.id.match(/^\d/)?'<span class="num">'+it.id+'</span>':'')+'<span>'+esc(L(cname))+'</span></div>'+
    '<h2 id="mtitle">'+esc(L(it.titulo))+'</h2>'+priceHtml(it)+whenHtml(it)+
    '<dl class="kv"><dt>'+t().estado+'</dt><dd>'+esc(L(it.estado))+'</dd>'+extraKv(it)+'</dl>'+
    '<p>'+esc(L(it.desc))+'</p>'+
    (it.status==='vendido'?'<p><b>'+t().sold+'</b></p>':it.status==='reservado'?'<p><b>'+t().resNote+'</b></p>':'')+
    '<div class="btns">'+waBtn(it)+'</div><p style="color:var(--muted);font-size:14px">'+esc(t().facts[0])+' · '+esc(t().facts[1])+'</p></div>';
  wire($('mbody'));
  $('modal').classList.add('open'); document.body.classList.add('locked');
  $('modal').scrollTop=0; document.title=L(it.titulo)+' · '+(lang==='ru'?'Распродажа':'Vendo todo');
  $('mclose').focus({preventScroll:true});
  if(lastView!==it.id){lastView=it.id;gc({path:'item-'+it.id,title:it.titulo.es,event:true})}
}
// GoatCounter: просмотры карточек и нажатия кнопок как события (localhost не считается)
var lastView='';
function gc(o){
  var g=window.goatcounter;
  if(g&&g.count){g.count(o);return}
  if(document.readyState!=='complete') window.addEventListener('load',function(){var g=window.goatcounter;if(g&&g.count)g.count(o)},{once:true});
}
function closeModal(fromHash){
  $('modal').classList.remove('open'); document.body.classList.remove('locked');
  $('mbody').querySelectorAll('video').forEach(function(v){v.pause()});
  document.title='Vendo todo por mudanza · Pueyrredón, Córdoba';
  if(!fromHash){
    if(openedHere){openedHere=false;history.back()}
    else history.replaceState(null,'',location.pathname+location.search);
  }
}
function toast(m){var e=$('toast');e.textContent=m;e.classList.add('on');setTimeout(function(){e.classList.remove('on')},1800)}

document.addEventListener('click',function(e){
  var b=e.target.closest('.lang button');
  if(b){lang=b.dataset.lang;try{localStorage.setItem('lang',lang)}catch(x){}render();return}
  var c=e.target.closest('.chip');
  if(c){cat=c.dataset.cat;renderChips();renderGrid();return}
  var m=e.target.closest('.wa,.tg');
  if(m){var it=find(m.closest('.card')?m.closest('.card').dataset.id:curHash());
    if(it) gc({path:(m.classList.contains('wa')?'click-whatsapp-':'click-telegram-')+it.id,title:it.titulo.es,event:true});return}
  if(e.target.closest('.arrow,video')) return;
  var card=e.target.closest('.card');
  if(card){openedHere=true;location.hash=card.dataset.id;return}
});
document.addEventListener('keydown',function(e){
  var card=e.target.closest&&e.target.closest('.card');
  if(card&&(e.key==='Enter'||e.key===' ')&&e.target===card){e.preventDefault();openedHere=true;location.hash=card.dataset.id}
  if($('modal').classList.contains('open')){
    if(e.key==='Escape') closeModal(false);
    var car=$('mbody').querySelector('.car');
    if(car&&car._go&&(e.key==='ArrowRight'||e.key==='ArrowLeft')) car._go(e.key==='ArrowRight'?1:-1);
  }
});
$('mclose').addEventListener('click',function(){closeModal(false)});
$('modal').addEventListener('click',function(e){if(!e.target.closest('.mbody,.ibtn')) closeModal(false)});
$('mshare').addEventListener('click',function(){
  var it=find(curHash()); var url=pageUrl(it?it.id:'');
  if(navigator.share){navigator.share({title:it?L(it.titulo):document.title,url:url}).catch(function(){});return}
  (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(function(){toast(t().copied)},function(){prompt('',url)});
});
window.addEventListener('hashchange',function(){var id=curHash();if(id)openItem(id);else closeModal(true)});

fetch('items.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(d){data=d;render()})
  .catch(function(){$('grid').innerHTML='<p class="empty">Error al cargar la lista. Recargá la página.</p>'});
})();
</script>
<script data-goatcounter="https://venta-mudanza.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
